[config]

[templates.test]
input_path = '/home/dancho/.config/matugen/templates/test.lua'
output_path = '/tmp/matugen-test.lua'

[templates.neovim-colors]
input_path = '/home/dancho/.config/matugen/templates/neovim-colors.lua'
output_path = '/home/dancho/.config/nvim/colors/dms.lua'

[templates.neovim-lualine]
input_path = '/home/dancho/.config/matugen/templates/neovim-lualine.lua'
output_path = '/home/dancho/.config/nvim/lua/lualine/themes/dms.lua'

[templates.papirus]
input_path = '/home/dancho/.config/matugen/templates/papirus_color.json'
output_path = '/home/dancho/.cache/matugen/papirus_color.json'
colors_to_compare = [
      { name = "adwaita",    color = "#3584e4" },
      { name = "black",      color = "#101010" },
      { name = "blue",       color = "#4a90e2" },
      { name = "bluegrey",   color = "#607d8b" },
      { name = "breeze",     color = "#3daee9" },
      { name = "brown",      color = "#8b5a2b" },
      { name = "carmine",    color = "#960018" },
      { name = "cyan",       color = "#00ffff" },
      { name = "darkcyan",   color = "#008b8b" },
      { name = "deeporange", color = "#ff5722" },
      { name = "green",      color = "#4caf50" },
      { name = "grey",       color = "#808080" },
      { name = "indigo",     color = "#3f51b5" },
      { name = "magenta",    color = "#ff00ff" },
      { name = "nordic",     color = "#4c566a" },
      { name = "orange",     color = "#ff9800" },
      { name = "palebrown",  color = "#987654" },
      { name = "paleorange", color = "#ffb84d" },
      { name = "pink",       color = "#e91e63" },
      { name = "red",        color = "#f44336" },
      { name = "teal",       color = "#009688" },
      { name = "violet",     color = "#8b00ff" },
      { name = "white",      color = "#ffffff" },
      { name = "yaru",       color = "#e95420" },
      { name = "yellow",     color = "#ffeb3b" }
  ]

  # Compare against the primary accent color generated by Matugen
  compare_to = "{{colors.primary.default.hex}}"

  # Debug pre_hook: print state to stdout before processing (picked up by journalctl
  # since matugen runs under a systemd unit whose output is journaled)
  pre_hook = 'echo "MATUGEN_PAPIRUS: Info: Image: {{image}} | Source HEX: {{colors.source_color.default.hex}} | Closest Papirus color: {{closest_color}}"'

  # post_hook: apply the computed color to the local theme and log success
  post_hook = 'papirus-folders -C {{closest_color}} -t Papirus-Dynamic && echo "MATUGEN_PAPIRUS: Success: color {{closest_color}} applied to the Papirus-Dynamic theme"'
